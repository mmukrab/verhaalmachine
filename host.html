<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>De Verhaalmachine · Regie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Literata:ital,opsz,wght@0,7..72,400;0,7..72,600;1,7..72,400&display=swap">
<link rel="stylesheet" href="css/style.css?v=14">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body class="host">
<canvas id="space" aria-hidden="true"></canvas>
<div class="join" id="join" hidden>
  <div id="qr" role="img" aria-label="QR-code naar het spel"></div>
  <div class="code" id="join-code"></div>
  <small id="join-url"></small>
</div>
<div class="wrap">
  <div id="regie" class="regie" hidden></div>
  <header style="display:grid;gap:6px">
    <span class="eyebrow">De Verhaalmachine · samen één verhaal</span>
    <h1 id="title">Regie</h1>
  </header>
  <nav class="arc" id="arc" aria-label="Verhaalboog"></nav>
  <section class="stage" id="stage"><p class="muted">Laden…</p></section>
  <section id="moderation" hidden></section>
  <section id="setup" hidden></section>
  <section class="manuscript panel" id="manuscript" hidden></section>
</div>
<script type="module" src="js/host.js?v=14"></script>
</body>
</html>
